---
version: '3'
services:
    pg1:
        image: postgres:17
        container_name: pg1
        hostname: pg1
        ports:
          - "5432"
        environment:
          POSTGRES_HOST_AUTH_METHOD: trust
        command: ["postgres", "-c", "wal_level=logical"]
        volumes:
          - "./:/docker"
        networks:
            public:
                ipv4_address: 10.111.220.11
    pg2:
        image: postgres:18
        container_name: pg2
        hostname: pg2
        ports:
          - "5432"
        environment:
          POSTGRES_HOST_AUTH_METHOD: trust
        command: ["postgres", "-c", "wal_level=logical"]
        volumes:
          - "./:/docker"
        networks:
            public:
                ipv4_address: 10.111.220.12
networks:
    public:
        driver: "bridge"
        ipam:
            config:
                - subnet: 10.111.220.0/24
