services:
  pg:
    image: postgres:17
    container_name: pgstats_demo
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_USER: postgres
      POSTGRES_DB: pgstats_demo
    ports:
      - "5433:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./demo:/demo:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pgstats_demo"]
      interval: 2s
      timeout: 5s
      retries: 30
